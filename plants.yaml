# Каталог растений PhytoVision: единый источник данных для
# обучения (классы), экспорта модели (русские названия) и базы PostgreSQL (справки).
version: 1
categories:
  - "Комнатные растения"
  - "Дача и огород"
  - "Сельское хозяйство"

# Роды. care заполнен у родов, в которых модель знает несколько видов:
# эта справка выдаётся, если уверенности в виде недостаточно.
genera:
  Ficus:
    ru: "Фикус"
    care: "Фикусы любят яркий рассеянный свет, постоянное место без сквозняков и умеренный полив после подсыхания верхнего слоя почвы. Листья периодически протирайте от пыли, зимой поливайте реже. Вид различается по листу: у каучуконосного листья крупные глянцевые, у Бенджамина мелкие заострённые, у лировидного крупные волнистые скрипкообразные."
  Aloe:
    ru: "Алоэ"
    care: "Алоэ — суккуленты: яркий свет, редкий полив только после полного просыхания грунта, рыхлый дренированный субстрат и прохладная зимовка. Основная причина гибели — переувлажнение."
  Dracaena:
    ru: "Драцена"
    care: "Драцены, включая сансевиерию, неприхотливы: рассеянный свет или полутень, умеренный полив после подсыхания верхнего слоя грунта (сансевиерию поливают заметно реже), защита от сквозняков и от застоя воды."
  Pelargonium:
    ru: "Пеларгония (герань)"
    care: "Пеларгонии любят много света, умеренный полив без застоя воды, прохладную зимовку и весеннюю обрезку. Листья не опрыскивают."
  Solanum:
    ru: "Паслён"
    care: "Паслёновые культуры (томат, картофель, баклажан) теплолюбивы: нужны солнце, регулярный полив под корень, подкормки и севооборот. Общая угроза — фитофтороз, поэтому не загущайте посадки и проветривайте теплицу."
  Allium:
    ru: "Лук"
    care: "Луковые (лук, чеснок) предпочитают солнечное место и рыхлую плодородную почву, умеренный полив с прекращением за 2–4 недели до уборки. Соблюдайте севооборот."
  Prunus:
    ru: "Слива и вишня"
    care: "Косточковые (вишня, слива) любят солнечное место, защищённое от ветра, нейтральную почву, полив в засуху и санитарную обрезку. Для урожая подбирайте опылители."
  Brassica:
    ru: "Капуста"
    care: "Капустные (капуста, рапс) — прохладолюбивые культуры: солнце, влажная плодородная почва, обильный полив, защита от крестоцветной блошки и севооборот."
  Chlorophytum: {ru: "Хлорофитум"}
  Spathiphyllum: {ru: "Спатифиллум"}
  Zamioculcas: {ru: "Замиокулькас"}
  Monstera: {ru: "Монстера"}
  Epipremnum: {ru: "Эпипремнум"}
  Crassula: {ru: "Толстянка"}
  Kalanchoe: {ru: "Каланхоэ"}
  Hibiscus: {ru: "Гибискус"}
  Phalaenopsis: {ru: "Фаленопсис"}
  Schlumbergera: {ru: "Шлюмбергера (декабрист)"}
  Saintpaulia: {ru: "Сенполия (узамбарская фиалка)"}
  Cucumis: {ru: "Огурец"}
  Cucurbita: {ru: "Тыква"}
  Capsicum: {ru: "Перец"}
  Daucus: {ru: "Морковь"}
  Anethum: {ru: "Укроп"}
  Fragaria: {ru: "Земляника и клубника"}
  Rubus: {ru: "Малина"}
  Ribes: {ru: "Смородина"}
  Malus: {ru: "Яблоня"}
  Rosa: {ru: "Роза"}
  Tulipa: {ru: "Тюльпан"}
  Triticum: {ru: "Пшеница"}
  Hordeum: {ru: "Ячмень"}
  Secale: {ru: "Рожь"}
  Avena: {ru: "Овёс"}
  Zea: {ru: "Кукуруза"}
  Helianthus: {ru: "Подсолнечник"}
  Glycine: {ru: "Соя"}
  Beta: {ru: "Свёкла"}
  Fagopyrum: {ru: "Гречиха"}
  Pisum: {ru: "Горох"}

plants:
  # ---------------- Комнатные растения (20) ----------------
  - id: Ficus_elastica
    latin: "Ficus elastica"
    ru: "Фикус каучуконосный (эластика)"
    genus: Ficus
    rank: species
    category: "Комнатные растения"
    inat: "Ficus elastica"
    care:
      summary: "Неприхотливое декоративно-лиственное растение с крупными глянцевыми листьями."
      light: "Яркий рассеянный свет, допустима лёгкая полутень."
      watering: "Умеренно, когда верхний слой почвы подсохнет на 2–3 см; зимой реже."
      temperature: "18–25 °C; зимой не ниже 12–15 °C."
      feeding: "С апреля по сентябрь раз в 2–3 недели удобрением для декоративно-лиственных."
      tips: "Протирайте листья влажной тканью, не переставляйте без нужды. Млечный сок может раздражать кожу."
  - id: Ficus_benjamina
    latin: "Ficus benjamina"
    ru: "Фикус Бенджамина"
    genus: Ficus
    rank: species
    category: "Комнатные растения"
    inat: "Ficus benjamina"
    care:
      summary: "Деревце с мелкими глянцевыми листьями; чувствительно к смене места и сквознякам."
      light: "Яркий рассеянный свет без жёсткого прямого солнца."
      watering: "Умеренно, после подсыхания верхнего слоя; не допускайте застоя воды."
      temperature: "18–25 °C; зимой не ниже 15 °C."
      feeding: "С весны до осени раз в 2–3 недели."
      tips: "Сбрасывает листья при сквозняках, перестановке и пересыхании кома."
  - id: Ficus_lyrata
    latin: "Ficus lyrata"
    ru: "Фикус лировидный"
    genus: Ficus
    rank: species
    category: "Комнатные растения"
    inat: "Ficus lyrata"
    care:
      summary: "Крупные волнистые листья скрипичной формы; требовательнее других фикусов."
      light: "Очень яркий рассеянный свет, лучше у южного или восточного окна."
      watering: "Умеренно, давая почве подсохнуть сверху; не заливайте."
      temperature: "18–24 °C, без сквозняков."
      feeding: "Весной и летом раз в 2 недели."
      tips: "Не любит перемен места; регулярно протирайте листья, поддерживайте влажность воздуха."
  - id: Aloe_vera
    latin: "Aloe vera"
    ru: "Алоэ вера"
    genus: Aloe
    rank: species
    category: "Комнатные растения"
    inat: "Aloe vera"
    care:
      summary: "Суккулент с мясистыми листьями, часто держат в домашней аптечке."
      light: "Яркий свет, допустимо прямое солнце (приучать постепенно)."
      watering: "Редко: после полного просыхания грунта; зимой раз в месяц."
      temperature: "20–28 °C летом; зимой 10–15 °C."
      feeding: "Весной и летом раз в месяц удобрением для кактусов и суккулентов."
      tips: "Нужен дренаж и рыхлый грунт; от избытка влаги быстро гниёт корень."
  - id: Aloe_arborescens
    latin: "Aloe arborescens"
    ru: "Алоэ древовидное (столетник)"
    genus: Aloe
    rank: species
    category: "Комнатные растения"
    inat: "Aloe arborescens"
    care:
      summary: "Ветвистый суккулент, вырастающий в небольшое деревце."
      light: "Яркий свет, лучше южное или восточное окно."
      watering: "Умеренно летом, скудно зимой; грунт должен просохнуть."
      temperature: "18–25 °C; зимой 10–14 °C."
      feeding: "Раз в месяц весной и летом."
      tips: "Летом полезно выносить на воздух; для здорового роста нужна прохладная зимовка."
  - id: Dracaena_trifasciata
    latin: "Dracaena trifasciata"
    ru: "Сансевиерия (щучий хвост, тёщин язык)"
    genus: Dracaena
    rank: species
    category: "Комнатные растения"
    inat: "Dracaena trifasciata"
    care:
      summary: "Очень выносливое растение с жёсткими вертикальными листьями."
      light: "От полутени до яркого света; пёстрые формы любят больше света."
      watering: "Редко: летом раз в 1–2 недели, зимой раз в месяц; не лейте в розетку листьев."
      temperature: "18–28 °C; не ниже 10 °C."
      feeding: "Раз в месяц весной и летом удобрением для суккулентов."
      tips: "Главная причина гибели — переувлажнение; нужен лёгкий дренированный грунт."
  - id: Dracaena_fragrans
    latin: "Dracaena fragrans"
    ru: "Драцена душистая"
    genus: Dracaena
    rank: species
    category: "Комнатные растения"
    inat: "Dracaena fragrans"
    care:
      summary: "Пальмовидное растение с широкими арочными листьями."
      light: "Яркий рассеянный свет или полутень."
      watering: "Умеренно, после подсыхания верхнего слоя; без застоя воды."
      temperature: "18–25 °C; зимой не ниже 12 °C."
      feeding: "Раз в 2–3 недели с весны до осени."
      tips: "Кончики листьев сохнут от сухого воздуха и жёсткой воды; опрыскивайте и поливайте отстоянной водой."
  - id: Chlorophytum_comosum
    latin: "Chlorophytum comosum"
    ru: "Хлорофитум хохлатый"
    genus: Chlorophytum
    rank: species
    category: "Комнатные растения"
    inat: "Chlorophytum comosum"
    care:
      summary: "Неприхотливое растение с полосатыми листьями и «детками» на длинных побегах."
      light: "Яркий рассеянный свет, переносит полутень."
      watering: "Регулярно летом, умеренно зимой; запасает влагу в утолщённых корнях."
      temperature: "18–25 °C; не ниже 10 °C."
      feeding: "Раз в 2–3 недели весной и летом."
      tips: "Кончики листьев буреют от сухого воздуха и жёсткой воды; легко размножается детками."
  - id: Spathiphyllum_wallisii
    latin: "Spathiphyllum wallisii"
    ru: "Спатифиллум («женское счастье»)"
    genus: Spathiphyllum
    rank: species
    category: "Комнатные растения"
    inat: "Spathiphyllum wallisii"
    care:
      summary: "Цветёт белыми покрывалами-соцветиями, любит влагу."
      light: "Полутень или рассеянный свет; прямое солнце вредно."
      watering: "Регулярно, грунт слегка влажный; при пересыхании листья вянут, но быстро оживают."
      temperature: "20–25 °C; не ниже 16 °C."
      feeding: "Раз в 2 недели в период роста и цветения."
      tips: "Опрыскивайте, используйте мягкую отстоянную воду. При нехватке света не цветёт."
  - id: Zamioculcas_zamiifolia
    latin: "Zamioculcas zamiifolia"
    ru: "Замиокулькас («долларовое дерево»)"
    genus: Zamioculcas
    rank: species
    category: "Комнатные растения"
    inat: "Zamioculcas zamiifolia"
    care:
      summary: "Очень выносливое растение, накапливающее воду в клубнях."
      light: "Рассеянный свет, переносит тень."
      watering: "Редко: после полного просыхания грунта, примерно раз в 1–2 недели."
      temperature: "18–26 °C; не ниже 12 °C."
      feeding: "Раз в месяц весной и летом."
      tips: "Не заливайте: клубни и корни легко гниют. Сок ядовит, работайте в перчатках."
  - id: Monstera_deliciosa
    latin: "Monstera deliciosa"
    ru: "Монстера деликатесная"
    genus: Monstera
    rank: species
    category: "Комнатные растения"
    inat: "Monstera deliciosa"
    care:
      summary: "Лиана с крупными резными листьями."
      light: "Яркий рассеянный свет."
      watering: "Умеренно, когда верхний слой подсохнет на 3–4 см."
      temperature: "18–27 °C; не ниже 15 °C."
      feeding: "Раз в 2 недели весной и летом."
      tips: "Нужна опора; воздушные корни не обрезайте, направляйте в грунт. Ядовита при поедании."
  - id: Epipremnum_aureum
    latin: "Epipremnum aureum"
    ru: "Эпипремнум золотистый (потос)"
    genus: Epipremnum
    rank: species
    category: "Комнатные растения"
    inat: "Epipremnum aureum"
    care:
      summary: "Неприхотливая лиана с пёстрыми сердцевидными листьями."
      light: "Рассеянный свет; в тени пёстрая окраска бледнеет."
      watering: "Умеренно, после подсыхания верхнего слоя грунта."
      temperature: "18–27 °C; не ниже 12 °C."
      feeding: "Раз в 2–3 недели весной и летом."
      tips: "Хорош в подвесных кашпо и на опоре; прищипывайте для кустистости. Ядовит для животных."
  - id: Pelargonium_zonale
    latin: "Pelargonium zonale"
    ru: "Пеларгония зональная (герань)"
    genus: Pelargonium
    rank: species
    category: "Комнатные растения"
    inat: "Pelargonium zonale"
    care:
      summary: "Цветёт почти всё тёплое время года, листья с запахом и тёмным пояском."
      light: "Много света, допустимо прямое солнце."
      watering: "Умеренно, после подсыхания верхнего слоя; без застоя воды."
      temperature: "18–25 °C; зимой лучше 8–12 °C."
      feeding: "Раз в 2 недели удобрением для цветущих растений с калием."
      tips: "Весной обрезайте и прищипывайте; листья не опрыскивайте."
  - id: Pelargonium_peltatum
    latin: "Pelargonium peltatum"
    ru: "Пеларгония плющелистная (ампельная герань)"
    genus: Pelargonium
    rank: species
    category: "Комнатные растения"
    inat: "Pelargonium peltatum"
    care:
      summary: "Пеларгония со свисающими побегами и плотными глянцевыми листьями."
      light: "Яркий свет, лучше без жаркого полуденного солнца."
      watering: "Умеренно, без застоя воды."
      temperature: "15–25 °C; зимой 8–12 °C."
      feeding: "Раз в 2 недели в период цветения."
      tips: "Хороша в подвесных кашпо; удаляйте увядшие соцветия."
  - id: Crassula_ovata
    latin: "Crassula ovata"
    ru: "Толстянка овальная (денежное дерево)"
    genus: Crassula
    rank: species
    category: "Комнатные растения"
    inat: "Crassula ovata"
    care:
      summary: "Суккулент с мясистыми округлыми листьями."
      light: "Яркий свет, допустимо прямое солнце."
      watering: "Редко: после просыхания грунта; зимой раз в месяц."
      temperature: "18–25 °C; зимой 10–15 °C."
      feeding: "Раз в месяц весной и летом удобрением для суккулентов."
      tips: "Прищипывайте для плотной кроны; в тени вытягивается."
  - id: Kalanchoe_blossfeldiana
    latin: "Kalanchoe blossfeldiana"
    ru: "Каланхоэ Блоссфельда"
    genus: Kalanchoe
    rank: species
    category: "Комнатные растения"
    inat: "Kalanchoe blossfeldiana"
    care:
      summary: "Суккулент с яркими соцветиями на зелёных мясистых листьях."
      light: "Яркий свет; для цветения нужен короткий световой день, около 10 часов."
      watering: "Умеренно, зимой редко."
      temperature: "18–25 °C; зимой 12–16 °C."
      feeding: "Раз в 2–3 недели во время роста."
      tips: "После цветения срезайте соцветия; избегайте переувлажнения."
  - id: Hibiscus_rosa-sinensis
    latin: "Hibiscus × rosa-sinensis"
    ru: "Гибискус китайский (китайская роза)"
    genus: Hibiscus
    rank: species
    category: "Комнатные растения"
    inat: "Hibiscus × rosa-sinensis"
    care:
      summary: "Кустарник с крупными яркими цветами, живущими 1–2 дня."
      light: "Яркий свет, немного прямого солнца."
      watering: "Обильно летом, умеренно зимой; не допускайте пересыхания."
      temperature: "18–25 °C; зимой 12–16 °C."
      feeding: "Раз в 1–2 недели летом, предпочтительны фосфорно-калийные удобрения."
      tips: "Сбрасывает бутоны при сквозняках и перестановке; формируйте обрезкой весной."
  - id: Phalaenopsis
    latin: "Phalaenopsis"
    ru: "Фаленопсис (орхидея)"
    genus: Phalaenopsis
    rank: genus
    category: "Комнатные растения"
    inat: "Phalaenopsis"
    care:
      summary: "Самая распространённая комнатная орхидея; в продаже в основном гибриды."
      light: "Яркий рассеянный свет, без прямого солнца."
      watering: "Погружением горшка на 15–30 минут, когда субстрат высох, а корни посеребрились; обычно раз в 5–10 дней."
      temperature: "18–25 °C; для цветения нужен перепад день/ночь в 5–7 °C."
      feeding: "Раз в 2–3 недели специальным удобрением для орхидей в половинной дозе."
      tips: "Прозрачный горшок и субстрат из коры; не заливайте точку роста, не срезайте зелёные воздушные корни."
  - id: Schlumbergera_truncata
    latin: "Schlumbergera truncata"
    ru: "Шлюмбергера усечённая (декабрист)"
    genus: Schlumbergera
    rank: species
    category: "Комнатные растения"
    inat: "Schlumbergera truncata"
    care:
      summary: "Эпифитный кактус с членистыми побегами, цветёт зимой."
      light: "Рассеянный свет, без жаркого прямого солнца."
      watering: "Умеренно; перед бутонизацией полив немного сократите."
      temperature: "18–24 °C; для закладки бутонов осенью 12–16 °C."
      feeding: "Раз в 2 недели весной и летом."
      tips: "Не переставляйте и не поворачивайте горшок во время бутонизации, иначе растение сбросит бутоны."
  - id: Saintpaulia_ionantha
    latin: "Saintpaulia ionantha"
    ru: "Сенполия (узамбарская фиалка)"
    genus: Saintpaulia
    rank: species
    category: "Комнатные растения"
    inat: "Streptocarpus ionanthus"
    care:
      summary: "Небольшое цветущее растение с бархатистыми листьями; в ботанике сейчас относится к роду Streptocarpus."
      light: "Яркий рассеянный свет (восточное или западное окно)."
      watering: "Тёплой отстоянной водой через поддон или под корень, не допуская попадания воды на листья."
      temperature: "18–24 °C."
      feeding: "Раз в 2 недели специальным удобрением для фиалок."
      tips: "Не опрыскивайте, пересаживайте в небольшой горшок; капли воды на листьях на солнце оставляют ожоги."

  # ---------------- Дача и огород (19) ----------------
  - id: Solanum_lycopersicum
    latin: "Solanum lycopersicum"
    ru: "Томат (помидор)"
    genus: Solanum
    rank: species
    category: "Дача и огород"
